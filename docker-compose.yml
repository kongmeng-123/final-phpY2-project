services:
  web:
    build: .
    container_name: final_php_web
    ports:
      - "9090:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: final_mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: final-project
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin
    container_name: final_php_pma
    restart: always
    ports:
      - "9091:80"
    environment:
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=root_password
    depends_on:
      - db

volumes:
  db_data: