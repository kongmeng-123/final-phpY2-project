services:
  # 1. PHP & Apache
  web:
    build: .
    container_name: php_web
    ports:
      - "9090:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  # 2. MySQL Database
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: final-project
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql

  # 3. phpMyAdmin (สำหรับจัดการ DB ผ่านเว็บ)
  phpmyadmin:
    image: phpmyadmin
    container_name: pma
    restart: always
    ports:
      - "9091:80"
    environment:
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=root_password
    depends_on:
      - db

volumes:
  db_data: